name: Deploy backend to Cloud Run

# main 에 백엔드(chat/) 변경이 push 되면 Cloud Run 에 다시 배포한다. 프론트(chat/web)만 바뀌면 건너뛴다.
# 이미지만 새로 만든다 — 환경변수·버킷 마운트·인스턴스 제한은 서비스에 저장된 값을 그대로 쓴다.
# 환경변수를 바꿀 때는 로컬에서 npm run deploy:cloudrun, OmniRoute 설정은 npm run omniroute:sync.
on:
  push:
    branches: [main]
    paths:
      - "chat/**"
      - "!chat/web/**"
      - ".github/workflows/cloudrun.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# 연달아 push 하면 진행 중인 배포를 취소하고 최신 커밋 하나만 배포한다.
# 취소된 실행의 Cloud Build 는 끝까지 돌 수 있지만, 리비전 생성은 gcloud 가 빌드 뒤에 하므로 배포되지 않는다.
concurrency:
  group: cloudrun-deploy
  cancel-in-progress: true

env:
  PROJECT: multimodal-pass-api
  REGION: asia-northeast3
  SERVICE: stan-chat-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # 비밀 키 없이 GitHub OIDC 토큰으로 인증한다. 이 저장소의 main 브랜치만 허용된다.
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/97870454047/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: github-deployer@multimodal-pass-api.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3

      - name: Build and deploy
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT" \
            --region "$REGION" \
            --source chat \
            --quiet

      - name: Health check
        run: |
          url=$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format "value(status.url)")
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "$url/health"
          printf 'Deployed `%s`\n\n%s\n' "$GITHUB_SHA" "$url" >> "$GITHUB_STEP_SUMMARY"
